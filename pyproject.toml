[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "audiobook-studio"
version = "5.2.0"
description = "Studio-Grade Multi-Voice Audiobook Production Engine & Antigravity Plugin with Gemini Flash TTS, 4D Formants, EBU R128 Mastering & Interactive Studio Panel."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Suraj (naksh-07)" }]
keywords = ["antigravity-plugin", "audiobook", "tts", "gemini-flash", "ffmpeg", "m4b", "speech-synthesis", "audio-mastering", "ebu-r128"]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
audiobook-studio = "audiobook_cli:main"
audiobook-maker = "audiobook_cli:main"
audiobook-factory = "audiobook_cli:main"
audio-master = "ffmpeg_mastering.audio_master:main"

[project.urls]
Homepage = "https://github.com/naksh-07/audiobook-studio"
Repository = "https://github.com/naksh-07/audiobook-studio"

[tool.setuptools.packages.find]
include = ["audiobook_factory*", "ffmpeg_mastering*"]
exclude = ["audiobooks*"]

[tool.setuptools]
py-modules = ["audiobook_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

